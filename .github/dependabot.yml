version: 2

updates:
  # Bun is the only package manager, so there is one manifest tree to watch.
  # See docs/adr/0007-single-lockfile-no-pnpm-parity.md.
  - package-ecosystem: npm
    directories:
      - '/'
      - '/apps/docs'
      - '/apps/gateway'
      - '/infra/pulumi'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      aws-sdk:
        patterns: ['@aws-sdk/*']
      pulumi:
        patterns: ['@pulumi/*']
      docusaurus:
        patterns: ['@docusaurus/*', 'react', 'react-dom', '@mdx-js/*']
      linting:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier', 'markdownlint*']
      testing:
        patterns: ['vitest', '@vitest/*', '@playwright/*']
    ignore:
      # Pinned deliberately: typescript-eslint@8 declares `typescript >=4.8.4 <6.1.0`, so a
      # major bump breaks type-aware linting on install.
      # See docs/adr/0002-typescript-pinned-to-6-x.md.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Pinned deliberately to whatever `@docusaurus/utils` resolves. `headingSlugs` in
      # scripts/docs/links.ts documents the requirement: the slugger it checks links against must
      # be the one Docusaurus uses, at the version it resolves, because that copy produces the
      # anchors the published site carries.
      # Docusaurus 3.10.2 asks for `^1.5.0`, so 2.0.0 installs a second copy beside it rather than
      # upgrading the site's, and the gate would be checking a different implementation than the
      # one that ships. Unpin when Docusaurus itself moves to 2.x.
      - dependency-name: github-slugger
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'ci(deps)'

  - package-ecosystem: docker
    directory: '/apps/gateway'
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(deps)'
