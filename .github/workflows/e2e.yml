name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile

      - name: Resolve the pinned Playwright version
        id: playwright
        run: |
          version=$(bun pm ls --all 2>/dev/null | grep -oE '@playwright/test@[0-9.]+' | head -1 | cut -d@ -f3)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache browsers
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      # The site build is a prerequisite, not a convenience: e2e exists to check that the gateway
      # serves the *real* build, and that the API survives being mounted behind a catch-all.
      - name: Build the documentation site
        run: bun run docs:build

      - run: bun run test:e2e

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
