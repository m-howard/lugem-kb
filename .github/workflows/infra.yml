name: Infrastructure

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'apps/gateway/Dockerfile'
      - '.github/workflows/infra.yml'
  workflow_dispatch:

concurrency:
  group: infra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The preview needs a Pulumi token and AWS credentials, which forks and freshly cloned
  # repositories do not have. Skipping cleanly keeps those green instead of failing for a reason
  # the contributor cannot fix. `configured` is computed in a step because `secrets` is not
  # available in job-level `if`.
  check-credentials:
    name: Check credentials
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.PULUMI_ACCESS_TOKEN }}" ] && [ -n "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping pulumi preview — PULUMI_ACCESS_TOKEN and AWS_ROLE_ARN are not configured for this repository."
          fi

  preview:
    name: Pulumi preview
    needs: check-credentials
    if: needs.check-credentials.outputs.configured == 'true'
    runs-on: ubuntu-latest
    # id-token for the AWS OIDC exchange; pull-requests because `comment-on-pr` below writes one.
    # Neither belongs on the other two jobs, which touch no credentials at all.
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # runtime: bun requires Pulumi CLI 3.226.0 or newer.
      # See docs/adr/0004-pulumi-with-bun-runtime.md.
      - uses: pulumi/actions@v7
        with:
          pulumi-version: '>=3.226.0'

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - run: bun install --frozen-lockfile

      - name: Preview
        uses: pulumi/actions@v7
        with:
          command: preview
          stack-name: ${{ vars.PULUMI_STACK || 'dev' }}
          work-dir: infra/pulumi
          comment-on-pr: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          # Only needed once `lugem-kb:corpusRepository` is set: the GitHub provider has to read
          # the repository's current rules to diff them. A secret cannot be named `GITHUB_*`, hence
          # the indirection. See docs/corpus-repository.md for the scopes it needs.
          GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}

  # There is deliberately no `pulumi up` here — deploys are run by hand. When one is added, it must
  # finish with `bun run scripts/check/verify-gateway.ts --wait-ready <seconds>` and fail on its
  # exit code: the target group probes /healthz, so nothing else stops a task with an unusable
  # GitHub App credential from joining it. See docs/authoring-gateway.md.

  # Stack validation is pure and needs no credentials, so it runs everywhere — including forks.
  # It is what catches a missing vpcId or an S3-Vectors-unsupported region before a preview would.
  validate-config:
    name: Validate stack configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # The whole infra unit project, not one named file: the stack and GitHub configuration are
      # validated by separate modules, and a hardcoded path silently stops covering the next one.
      - run: bun run vitest run --project unit infra/pulumi
