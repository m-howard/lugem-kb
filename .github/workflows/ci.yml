name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # requirements.md R13. Its own job rather than a step inside `lint`, because the failure has an
  # audience: an author who submitted a page through /publisher sees "Content quality gates" red in the
  # checks list, and the comment step below tells them why without them opening a log.
  content:
    name: Content quality gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile

      # `--github` adds ::error annotations on top of the readable report, so a broken link is
      # pinned to its line in the diff as well as summarised.
      - name: Check frontmatter, ownership and internal links
        id: check
        run: bun run docs:check --github

      # R13's third criterion: "failures surface as a readable message, not a raw log". Runs on
      # success too, so a comment left by an earlier failing push is corrected rather than left
      # contradicting a green check. A fork's token cannot write comments, hence the head check.
      # `|| true` because the runner exits non-zero when it found something, which is the case
      # this step exists for. The report itself is on stdout either way.
      - name: Render the report as a comment
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: bun run docs:check --markdown > "${RUNNER_TEMP}/docs-check.md" || true

      - name: Post or update the comment
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        env:
          PASSED: ${{ steps.check.outcome == 'success' }}
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- lugem-docs-check -->';
            const body = `${marker}\n${fs.readFileSync(`${process.env.RUNNER_TEMP}/docs-check.md`, 'utf8')}`;
            const scope = { owner: context.repo.owner, repo: context.repo.repo };
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...scope,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body?.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({ ...scope, comment_id: existing.id, body });
            } else if (process.env.PASSED !== 'true') {
              // Only a failure is worth introducing a comment for. A clean pull request stays
              // quiet unless there is already a comment to correct.
              await github.rest.issues.createComment({
                ...scope,
                issue_number: context.issue.number,
                body,
              });
            }

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run lint:md

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Unit and integration tests with the coverage gate
        run: bun run test:coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile

      # Fails on a broken link on purpose: a broken link in the corpus becomes a broken citation
      # once the page is indexed.
      - name: Build the documentation site
        run: bun run docs:build

      # Build context is the repo root — the Docusaurus content root lives there, not under
      # apps/docs — so this also proves .dockerignore has not started excluding docs/.
      - name: Build the container image
        run: docker build -f apps/gateway/Dockerfile -t lugem-gateway:ci .

      - name: The container answers its liveness probe
        run: |
          docker run -d --name gateway -p 3000:3000 \
            -e AWS_REGION=us-east-1 \
            -e CORPUS_BUCKET=ci-placeholder \
            -e CORPUS_PREFIX=docs/ \
            -e KNOWLEDGE_BASE_ID=ci-placeholder \
            -e ANSWER_MODEL_ID=ci-placeholder \
            lugem-gateway:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz; then
              echo "healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "gateway never became healthy"
          docker logs gateway
          exit 1

      - name: Container logs on failure
        if: failure()
        run: docker logs gateway || true
