<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Color Tints" subtitle="Red, Blue, Navy tint scales blended with white" viewport="700x240" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Aeonik', 'DM Sans', sans-serif; background: #fff; color: #0f172a; padding: 28px; -webkit-font-smoothing: antialiased; }
.row { display: flex; gap: 4px; align-items: stretch; margin-bottom: 10px; }
.row-label { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: #94a3b8; width: 50px; flex-shrink: 0; display: flex; align-items: center; }
.strips { display: flex; gap: 4px; flex: 1; }
.strip { flex: 1; border-radius: 2px; position: relative; }
.strip-inner { height: 48px; border-radius: 2px; }
.pct { font-size: 9px; color: #94a3b8; margin-top: 5px; text-align: center; letter-spacing: 0.04em; }
.rule { margin-top: 18px; padding-top: 14px; border-top: 1px solid #e2e8f0; font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.08em; }
</style>
</head>
<body>
  <!-- Indigo Tints -->
  <div class="row">
    <div class="row-label">Indigo</div>
    <div class="strips">
      <div class="strip"><div class="strip-inner" style="background:#4f46e5;"></div><div class="pct">100%</div></div>
      <div class="strip"><div class="strip-inner" style="background:#726bea;"></div><div class="pct">80%</div></div>
      <div class="strip"><div class="strip-inner" style="background:#9590ef;"></div><div class="pct">60%</div></div>
      <div class="strip"><div class="strip-inner" style="background:#b9b5f5;"></div><div class="pct">40%</div></div>
      <div class="strip"><div class="strip-inner" style="background:#dcdafa;"></div><div class="pct">20%</div></div>
      <div class="strip"><div class="strip-inner" style="background:#eeedfd;"></div><div class="pct">10%</div></div>
    </div>
  </div>

  <!-- Slate Tints -->
  <div class="row">
    <div class="row-label">Slate</div>
    <div class="strips">
      <div class="strip"><div class="strip-inner" style="background:#0f172a;"></div><div class="pct">100%</div></div>
      <div class="strip"><div class="strip-inner" style="background:#3f4555;"></div><div class="pct">80%</div></div>
      <div class="strip"><div class="strip-inner" style="background:#6f747f;"></div><div class="pct">60%</div></div>
      <div class="strip"><div class="strip-inner" style="background:#9fa2aa;"></div><div class="pct">40%</div></div>
      <div class="strip"><div class="strip-inner" style="background:#cfd1d4;"></div><div class="pct">20%</div></div>
      <div class="strip"><div class="strip-inner" style="background:#e8e8ea;"></div><div class="pct">10%</div></div>
    </div>
  </div>

  <!-- Emerald Tints -->
  <div class="row">
    <div class="row-label">Emerald</div>
    <div class="strips">
      <div class="strip"><div class="strip-inner" style="background:#10b981;"></div><div class="pct">100%</div></div>
      <div class="strip"><div class="strip-inner" style="background:#40c79a;"></div><div class="pct">80%</div></div>
      <div class="strip"><div class="strip-inner" style="background:#70d5b3;"></div><div class="pct">60%</div></div>
      <div class="strip"><div class="strip-inner" style="background:#9fe3cd;"></div><div class="pct">40%</div></div>
      <div class="strip"><div class="strip-inner" style="background:#cff1e6;"></div><div class="pct">20%</div></div>
      <div class="strip"><div class="strip-inner" style="background:#e8f8f3;"></div><div class="pct">10%</div></div>
    </div>
  </div>

  <!-- Coral Tints -->
  <div class="row">
    <div class="row-label">Coral</div>
    <div class="strips">
      <div class="strip"><div class="strip-inner" style="background:#ef4444;"></div><div class="pct">100%</div></div>
      <div class="strip"><div class="strip-inner" style="background:#f26969;"></div><div class="pct">80%</div></div>
      <div class="strip"><div class="strip-inner" style="background:#f58f8f;"></div><div class="pct">60%</div></div>
      <div class="strip"><div class="strip-inner" style="background:#f9b4b4;"></div><div class="pct">40%</div></div>
      <div class="strip"><div class="strip-inner" style="background:#fbd0d0;"></div><div class="pct">20%</div></div>
      <div class="strip"><div class="strip-inner" style="background:#fde8e8;"></div><div class="pct">10%</div></div>
    </div>
  </div>

  <div class="rule">Tints — blend with white only · backgrounds, hover states, status fills</div>
</body>
</html>
