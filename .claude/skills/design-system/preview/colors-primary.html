<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Primary Colors" subtitle="Red · Blue · Light Blue — headers, blocks, icons" viewport="700x220" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Aeonik', 'DM Sans', sans-serif; background: #fff; color: #0f172a; padding: 28px; -webkit-font-smoothing: antialiased; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.swatch-block { height: 116px; border-radius: 2px; margin-bottom: 14px; }
.name { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 5px; }
.hex  { font-size: 12px; color: #475569; font-family: 'Courier New', monospace; margin-bottom: 10px; }
.use  { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.07em; }
.rule { margin-top: 28px; padding-top: 18px; border-top: 1px solid #e2e8f0; font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.08em; }
</style>
</head>
<body>
  <div class="grid">
    <div>
      <div class="swatch-block" style="background:#4f46e5;"></div>
      <div class="name">Indigo</div>
      <div class="hex">#4f46e5</div>
      <div class="use">Primary Actions · Links · Focus</div>
    </div>
    <div>
      <div class="swatch-block" style="background:#0f172a;"></div>
      <div class="name">Slate</div>
      <div class="hex">#0f172a</div>
      <div class="use">Ink · Headers · Dark Surfaces</div>
    </div>
    <div>
      <div class="swatch-block" style="background:#e2e8f0;"></div>
      <div class="name">Mist</div>
      <div class="hex">#e2e8f0</div>
      <div class="use">Surfaces · Dividers · Code BG</div>
    </div>
  </div>
  <div class="rule">Primary palette — structural colors for headers, surfaces, and brand</div>
</body>
</html>
