<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Secondary Colors" subtitle="Salmon · Navy · Silver · Steel Blue — charts, accents" viewport="700x220" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Aeonik', 'DM Sans', sans-serif; background: #fff; color: #0f172a; padding: 28px; -webkit-font-smoothing: antialiased; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.swatch-block { height: 100px; border-radius: 2px; margin-bottom: 12px; }
.name { font-size: 12px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 4px; }
.hex  { font-size: 11px; color: #475569; font-family: 'Courier New', monospace; margin-bottom: 8px; }
.use  { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.07em; }
.rule { margin-top: 24px; padding-top: 16px; border-top: 1px solid #e2e8f0; font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.08em; }
</style>
</head>
<body>
  <div class="grid">
    <div>
      <div class="swatch-block" style="background:#10b981;"></div>
      <div class="name">Emerald</div>
      <div class="hex">#10b981</div>
      <div class="use">Success · Pass · Merge</div>
    </div>
    <div>
      <div class="swatch-block" style="background:#f59e0b;"></div>
      <div class="name">Amber</div>
      <div class="hex">#f59e0b</div>
      <div class="use">Warning · Pending</div>
    </div>
    <div>
      <div class="swatch-block" style="background:#ef4444;"></div>
      <div class="name">Coral</div>
      <div class="hex">#ef4444</div>
      <div class="use">Error · Fail · Breaking</div>
    </div>
    <div>
      <div class="swatch-block" style="background:#8b5cf6;"></div>
      <div class="name">Violet</div>
      <div class="hex">#8b5cf6</div>
      <div class="use">Accent · Featured</div>
    </div>
  </div>
  <div class="rule">Secondary palette — semantic state colors, charts, accents</div>
</body>
</html>
