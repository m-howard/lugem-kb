<!DOCTYPE html>
<!-- @dsCard group="Components" name="Badges & Tags" subtitle="Status badges, category tags, pills, count badges" viewport="700x280" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Aeonik', 'DM Sans', sans-serif; background: #fff; color: #0f172a; padding: 28px; -webkit-font-smoothing: antialiased; }
.section-label { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8; margin-bottom: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; align-items: center; }
.row:last-child { margin-bottom: 0; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 4px; font-size: 12px; font-weight: 500; letter-spacing: 0.02em; }
.badge-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.tag { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 4px; font-size: 12px; font-weight: 500; letter-spacing: 0.03em; }
.num-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 4px; font-size: 11px; font-weight: 700; }
.pill { display: inline-flex; align-items: center; padding: 4px 14px; border-radius: 9999px; font-size: 12px; font-weight: 500; }
</style>
</head>
<body>
  <div class="section-label">Status — Build &amp; Deploy</div>
  <div class="row">
    <span class="badge" style="background:#e8f8f3; color:#10b981;"><span class="badge-dot" style="background:#10b981;"></span>Passing</span>
    <span class="badge" style="background:#fef3e1; color:#f59e0b;"><span class="badge-dot" style="background:#f59e0b;"></span>Running</span>
    <span class="badge" style="background:#fde8e8; color:#ef4444;"><span class="badge-dot" style="background:#ef4444;"></span>Failed</span>
    <span class="badge" style="background:#f1f5f9; color:#475569;"><span class="badge-dot" style="background:#94a3b8;"></span>Skipped</span>
    <span class="badge" style="background:#eeedfd; color:#4f46e5;"><span class="badge-dot" style="background:#4f46e5;"></span>Queued</span>
  </div>
  <div class="section-label">Category Tags</div>
  <div class="row">
    <span class="tag" style="background:#0f172a; color:#fff;">backend</span>
    <span class="tag" style="background:#4f46e5; color:#fff;">api</span>
    <span class="tag" style="background:#dcdafa; color:#4f46e5;">infra</span>
    <span class="tag" style="background:#10b981; color:#fff;">stable</span>
    <span class="tag" style="background:#8b5cf6; color:#fff;">experimental</span>
    <span class="tag" style="background:#f1f5f9; color:#475569;">archived</span>
    <span class="tag" style="border: 1.5px solid #cbd5e1; color:#475569;">draft</span>
  </div>
  <div class="section-label">Pill — Branches &amp; Versions</div>
  <div class="row">
    <span class="pill" style="background:#4f46e5; color:#fff;">main</span>
    <span class="pill" style="background:#eeedfd; color:#4f46e5;">v2.4.0</span>
    <span class="pill" style="background:#f1f5f9; color:#475569;">staging</span>
    <span class="pill" style="border:1.5px solid #ef4444; color:#ef4444;">hotfix</span>
  </div>
  <div class="section-label">Count Badges</div>
  <div class="row">
    <span class="num-badge" style="background:#ef4444; color:#fff;">3</span>
    <span class="num-badge" style="background:#4f46e5; color:#fff;">12</span>
    <span class="num-badge" style="background:#0f172a; color:#fff;">99+</span>
    <span class="num-badge" style="background:#f1f5f9; color:#475569;">7</span>
    <span style="font-size:13px; color:#475569; margin-left:8px;">Tabs · notifications · review counts</span>
  </div>
</body>
</html>
