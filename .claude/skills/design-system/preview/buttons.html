<!DOCTYPE html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Filled, outlined, ghost — all sizes and dark-bg variants" viewport="700x300" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Aeonik', 'DM Sans', sans-serif; background: #fff; color: #0f172a; padding: 28px; -webkit-font-smoothing: antialiased; }
.section-label { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8; margin-bottom: 14px; }
.row { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
.row:last-child { margin-bottom: 0; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 0 20px; height: 40px; font-family: 'Aeonik', 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.01em; border: none; cursor: pointer; border-radius: 4px; }
.btn-sm { height: 32px; padding: 0 14px; font-size: 12px; }
.btn-lg { height: 48px; padding: 0 28px; font-size: 16px; }
.btn-indigo { background: #4f46e5; color: #fff; }
.btn-slate { background: #0f172a; color: #fff; }
.btn-emerald { background: #10b981; color: #fff; }
.btn-coral { background: #ef4444; color: #fff; }
.btn-outline { background: transparent; color: #0f172a; border: 1.5px solid #cbd5e1; }
.btn-outline-indigo { background: transparent; color: #4f46e5; border: 1.5px solid #4f46e5; }
.btn-ghost { background: transparent; color: #475569; }
.btn-disabled { background: #f1f5f9; color: #94a3b8; cursor: not-allowed; }
</style>
</head>
<body>
  <div class="section-label">Filled</div>
  <div class="row">
    <button class="btn btn-indigo">Primary Action</button>
    <button class="btn btn-slate">Secondary</button>
    <button class="btn btn-emerald">Confirm Merge</button>
    <button class="btn btn-coral">Delete</button>
    <button class="btn btn-disabled" disabled>Disabled</button>
  </div>
  <div class="section-label">Outlined</div>
  <div class="row">
    <button class="btn btn-outline">Cancel</button>
    <button class="btn btn-outline-indigo">View Diff</button>
    <button class="btn btn-ghost">Ghost / Text</button>
  </div>
  <div class="section-label">Size Scale</div>
  <div class="row">
    <button class="btn btn-indigo btn-sm">Small</button>
    <button class="btn btn-indigo">Medium</button>
    <button class="btn btn-indigo btn-lg">Large</button>
  </div>
  <div class="section-label">On Slate</div>
  <div class="row" style="background:#0f172a; padding:16px; border-radius:4px; margin-bottom:0;">
    <button class="btn" style="background:#4f46e5; color:#fff;">Indigo</button>
    <button class="btn" style="background:#10b981; color:#fff;">Emerald</button>
    <button class="btn" style="background:transparent; color:#fff; border:1.5px solid #475569;">Outline</button>
    <button class="btn" style="background:transparent; color:#cbd5e1;">Ghost</button>
  </div>
</body>
</html>
