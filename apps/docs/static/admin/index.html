<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Not indexed and not linked from the site. The editor is for the handful of people who
      author documentation, and a reader who lands here has taken a wrong turn.
    -->
    <meta name="robots" content="noindex" />
    <title>Documentation CMS</title>
    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }

      #sign-in-status {
        margin: 4rem auto;
        max-width: 34rem;
        padding: 0 1.5rem;
        text-align: center;
        color: #444;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <!--
      Decap replaces the page once it initialises, so this is what an author sees while the
      gateway is asked how to sign them in — and what they are left with if it cannot be done.
      An empty page with an error in the console is not a message.
    -->
    <p id="sign-in-status">Signing you in…</p>

    <!--
      Produced by scripts/build/build-admin.ts from apps/docs/src/admin/, and gitignored. Decap is
      bundled into it rather than loaded separately: its dist file externalises React as a peer
      dependency, so behind a script tag it reaches for globals nothing defines.
    -->
    <script type="module" src="./admin.js"></script>
  </body>
</html>
